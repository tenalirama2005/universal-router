# k8s/base/20-specialists.yaml
# Five specialists, ClusterIP-only. None are exposed externally; only the
# router can reach them. NetworkPolicy below enforces this even if a
# specialist is misconfigured.
#
# Image tags are placeholders — replace each with the existing DockerHub
# tag you're already running for that specialist (your tenalirama2026/*
# pattern). The point of this manifest is the K8s topology; the images
# themselves are unchanged from your current Sprint 4 deployments.

# ── CyberGym (vuln-repro) ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybergym-specialist
  namespace: agentx-purple
  labels:
    app: cybergym-specialist
    capability: vuln-repro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cybergym-specialist
  template:
    metadata:
      labels:
        app: cybergym-specialist
        capability: vuln-repro
    spec:
      containers:
        - name: cybergym
          # Replace with your current CyberGym v82 image tag.
          image: tenalirama2026/cybergym-agentx-v2:v82
          imagePullPolicy: Always
          ports:
            - containerPort: 9019
          env:
            - name: PORT
              value: "9019"
            - name: CYBERGYM_MODEL_PRIORITY
              value: "gpt-5.5,gpt-5.4"
            - name: CYBERGYM_MIN_COMPLETION_TOKENS
              value: "20"
            - name: CYBERGYM_PATCH_WINDOWS
              value: "1"
          envFrom:
            - secretRef:
                name: azure-openai-creds
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "2Gi" }
          # /work scratchspace — emptyDir so each pod restart starts clean.
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cybergym-specialist
  namespace: agentx-purple
spec:
  type: ClusterIP
  selector:
    app: cybergym-specialist
  ports:
    - port: 9019
      targetPort: 9019
---
