# k8s/base/10-router.yaml
# The router is the ONLY purple-agent component AgentBeats sees.
# It exposes itself via a Service that the Istio Gateway routes external
# traffic to; specialists are reachable only via in-cluster ClusterIP DNS.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: agentx-purple
  labels:
    app: router
    component: purple-agent-front
spec:
  replicas: 2  # HA — one router restart shouldn't kill the leaderboard.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
        component: purple-agent-front
      annotations:
        # Useful for post-run analysis — Istio adds these to every span.
        sidecar.istio.io/proxyCPU: "100m"
        sidecar.istio.io/proxyMemory: "128Mi"
    spec:
      containers:
        - name: router
          # Replace with your registry path; matches your tenalirama2026/* pattern.
          image: tenalirama2026/agentx-purple-router:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: PORT
              value: "9000"
            - name: AGENT_URL
              # The external URL AgentBeats sees. Tracked separately from
              # internal-only routing so the agent-card is correct.
              value: "https://agentx.forthecloudbythecloud.in"
          envFrom:
            - configMapRef:
                name: router-upstreams
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Liveness — only checks that the process is responsive.
          # Don't be too aggressive; the router blocks on long forwarded calls.
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness — also checks /health. Could be extended later to verify
          # upstream reachability, but for now we accept the router as ready
          # as soon as it binds.
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: agentx-purple
  labels:
    app: router
spec:
  type: ClusterIP
  selector:
    app: router
  ports:
    - name: http
      port: 80
      targetPort: 9000
      protocol: TCP
